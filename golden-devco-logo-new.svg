<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 320" role="img" aria-labelledby="title desc">
  <title id="title">Golden Devco</title>
  <desc id="desc">Golden Devco logo with metallic gold GOLDEN, silver DEVCO, and gold and silver forward edge mark.</desc>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff0a2"/>
      <stop offset="0.18" stop-color="#f7c84a"/>
      <stop offset="0.48" stop-color="#b87508"/>
      <stop offset="0.7" stop-color="#ffd75a"/>
      <stop offset="1" stop-color="#8d5600"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.24" stop-color="#d8dce1"/>
      <stop offset="0.5" stop-color="#7a8088"/>
      <stop offset="0.72" stop-color="#f7f8fa"/>
      <stop offset="1" stop-color="#8a9098"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="5" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <text x="35" y="205" font-family="Eurostile, Orbitron, Michroma, 'Arial Black', sans-serif" font-size="168" font-weight="800" letter-spacing="7" fill="url(#gold)" stroke="#3f2600" stroke-width="3" paint-order="stroke">GOLDEN</text>
    <text x="745" y="205" font-family="Eurostile, Orbitron, Michroma, 'Arial Black', sans-serif" font-size="168" font-weight="800" letter-spacing="7" fill="url(#silver)" stroke="#24272b" stroke-width="3" paint-order="stroke">DEVCO</text>

    <path d="M1218 76 H1394 L1480 159 L1394 244" fill="none" stroke="url(#silver)" stroke-width="18" stroke-linejoin="miter"/>
    <path d="M1248 92 H1364 L1437 159 L1364 225" fill="none" stroke="#151515" stroke-width="10" stroke-linejoin="miter"/>
    <path d="M1280 106 H1346 L1405 159 L1346 212" fill="none" stroke="url(#gold)" stroke-width="9" stroke-linejoin="miter"/>
  </g>
</svg>