<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Golden Devco Upload Center</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      background: radial-gradient(circle at top left, #3a2d00 0%, #000000 45%);
      font-family: Arial, sans-serif;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 90%;
      max-width: 900px;
      background: #000;
      border: 1px solid #5e4c12;
      border-radius: 30px;
      padding: 50px;
      box-shadow: 0 0 25px rgba(255, 215, 0, 0.15);
    }

    h1 {
      font-size: 72px;
      margin-bottom: 20px;
      color: #e7cd67;
    }

    p {
      font-size: 18px;
      margin-bottom: 40px;
      color: #f0f0f0;
    }

    .upload-box {
      border: 3px dashed #7a6420;
      border-radius: 25px;
      padding: 60px 40px;
      text-align: center;
    }

    .upload-box h2 {
      font-size: 28px;
      margin-bottom: 35px;
    }

    input[type="file"] {
      margin-bottom: 35px;
      color: white;
      font-size: 18px;
    }

    button {
      width: 100%;
      padding: 22px;
      border: none;
      border-radius: 18px;
      background: #b59a3a;
      color: black;
      font-size: 24px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s ease;
    }

    button:hover {
      background: #d4b24a;
    }

    #statusMessage {
      margin-top: 30px;
      font-size: 22px;
      color: #e7cd67;
      word-break: break-word;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>Upload Center</h1>

    <p>
      Upload files, images, assets, documents, and media into the Golden Devco cloud storage system.
    </p>

    <div class="upload-box">
      <h2>Select File</h2>

      <input type="file" id="fileInput" />

      <button onclick="uploadFile()">
        Upload File
      </button>

      <div id="statusMessage"></div>
    </div>
  </div>

  <script>
    const WEBHOOK_URL = "https://primary-production-79128.up.railway.app/webhook-test/upload-file";

    async function uploadFile() {
      const fileInput = document.getElementById("fileInput");
      const statusMessage = document.getElementById("statusMessage");

      if (!fileInput.files.length) {
        statusMessage.innerText = "Please select a file.";
        return;
      }

      const file = fileInput.files[0];

      const formData = new FormData();
      formData.append("file", file);

      statusMessage.innerText = "Uploading...";

      try {

        const response = await fetch(WEBHOOK_URL, {
  method: "POST",

  headers: {
    "Authorization": "Dawgsfan69!"
  },

  body: formData
});

        const result = await response.text();

        if (response.ok) {
          statusMessage.innerText = "Upload successful!";
        } else {
          statusMessage.innerText = `Upload error: ${result}`;
        }

      } catch (error) {
        statusMessage.innerText = `Upload failed: ${error.message}`;
      }
    }
  </script>

</body>
</html>
